name: Claude review

# Runs on the owner's Claude subscription (OAuth token), never on a per-token API key.
# Only reviews when it's worth it: feat/refactor PRs once (not on every push), or on request.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        (
          contains(github.event.pull_request.title, 'feat(') ||
          contains(github.event.pull_request.title, 'feat:') ||
          contains(github.event.pull_request.title, 'refactor(') ||
          contains(github.event.pull_request.title, 'refactor:')
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.author_association == 'OWNER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # A comment event runs on the default branch, so check out the PR's head explicitly.
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # TEMPORARY: shows Claude's error while the first review fails instantly (#38). Remove once fixed.
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            The PR's head is already checked out in the current working directory.
            Find the linked issue from "Closes #N" in the PR description and read it with `gh issue view`.

            Review this PR against AGENTS.md. Check the log invariants, the product rules
            (especially the spoiler rule), domain purity, tests for every behaviour the linked
            issue requires, and the linked issue's acceptance criteria. Report only concrete
            problems, each with file:line and a suggested fix. If there are none, say so in one line.

            Post the review with `gh pr comment` (one top-level comment), and use
            `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            problems tied to a specific line. Only post GitHub comments; don't reply in messages.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
