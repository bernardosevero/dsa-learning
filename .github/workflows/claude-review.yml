name: Claude review

# Runs on the owner's Claude subscription (OAuth token), never on a per-token API key.
# Reviews every PR except docs, once: when it's opened or marked ready (not on every push), or
# when the owner comments "@claude review". It never merges: it hands every PR to the owner.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.title, 'docs(') &&
        !contains(github.event.pull_request.title, 'docs:')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude review') &&
        github.event.comment.author_association == 'OWNER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # A comment event runs on the default branch, so check out the PR explicitly. The merge ref
      # carries main's copy of this workflow, which the action requires; a PR branch created before
      # a workflow change would otherwise be skipped.
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}
            OWNER: ${{ github.repository_owner }}

            The PR, merged into main, is already checked out in the current working directory.
            Find the linked issue from "Closes #N" in the PR description and read it with `gh issue view`.
            Review by reading the code only (`gh pr diff`, then Read, Grep and Glob for context).
            Don't run tests, lint or builds; CI runs them.

            1. Review this PR against AGENTS.md: the log invariants, the product rules (especially
               the spoiler rule), domain purity, the code style, tests for every behaviour the linked
               issue requires, and the linked issue's acceptance criteria. Only concrete problems
               count, each with file:line and a suggested fix.
               For changes under src/ui/, also review against
               .claude/skills/working-on-ui/SKILL.md and its design.md, and flag:
               - a control or surface not built from a shadcn/ui component in
                 src/ui/primitives/: a hand-rolled button, badge, card, input, textarea or
                 radio, or their classes copied onto a plain element;
               - the same markup or class string repeated across files instead of one shared
                 piece;
               - code split into many tiny files, or page/screen pairs, only to fit a size, when
                 it would read better in one file;
               - touch targets under 44px (`min-h-11`), and times, dates or counts not in
                 `font-mono`.
            2. Post one top-level comment with `gh pr comment`. Start it with "@OWNER ready for your
               review" (using the OWNER above), then your findings, or "No problems found.". Use
               `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
               problems tied to a specific line.
            3. Hand the PR to the owner: `gh pr edit <PR NUMBER> --add-assignee <OWNER> --add-label needs-owner`.

            Never merge. Only post GitHub comments; don't reply in messages.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh pr edit:*)"
